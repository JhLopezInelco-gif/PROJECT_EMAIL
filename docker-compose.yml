version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: email_sender_backend
    restart: unless-stopped
    environment:
      - ADMIN_USER=Admin1
      - ADMIN_PASSWORD=Admin123
      - SECRET_KEY=your-secret-key-change-in-production-12345
      - DATABASE_URL=sqlite:///./data/email_sender.db
    volumes:
      - ./data:/app/data
    networks:
      - email_network
    expose:
      - "7374"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7374/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: email_sender_nginx
    restart: unless-stopped
    ports:
      - "1482:80"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - email_network

networks:
  email_network:
    driver: bridge